name: bracketsched
slug: bracketsched

category: software
subcategory: "Data Structures coursework (CS216)"

status: completed

visibility: public

description:
  short: "bracketsched: a native C++ library (with a C ABI) for deterministic single- and double-elimination bracket generation for any team count, with a named seeding algorithm and documented invariants."
  long: |
    Started as a Data Structures course project (Air University, Semester
    3, Fall 2024) that scheduled a fixed 16-team bracket via a BST
    (rankings) and queue (match order), in three parallel implementations.
    Rebuilt into bracketsched: a small embeddable library for arbitrary
    -size single- and double-elimination brackets. Implements the real
    "inner-outer" seeding algorithm (not bit-reversal), automatic
    mathematically-correct top-seed byes for non-power-of-two team counts,
    a named double-elimination cross-bracketing policy (alternating) and
    Grand Final reset semantics, deterministic canonical JSON output, and
    a stable JSON-based C ABI verified against an independent consumer
    program. All three original implementations preserved unmodified
    under archive/academic-original/.

